<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - UserManager Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="nav-container">
                <a href="index.html" class="nav-logo"><i class="fas fa-users-cog"></i> UserManager Pro</a>
                <div class="nav-controls">
                    <button id="themeToggle" class="nav-btn" title="Toggle Theme">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main class="main">
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-title">User Management</h1>
                <p class="hero-subtitle">Manage and interact with user profiles and data</p>
            </div>
        </section>

        <section class="controls-section">
            <div class="container">
                <div class="controls-grid">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="userSearch" placeholder="Search users by name, email, or city...">
                        <button id="clearSearch" class="clear-btn hidden">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    
                    <div class="filter-controls">
                        <select id="statusFilter" class="filter-select">
                            <option value="all">All Status</option>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                        
                        <select id="sortSelect" class="filter-select">
                            <option value="name-asc">Sort by Name (A-Z)</option>
                            <option value="name-desc">Sort by Name (Z-A)</option>
                            <option value="join-desc">Newest First</option>
                            <option value="join-asc">Oldest First</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <section class="users-section">
            <div class="container">
                <div class="section-header">
                    <h2><i class="fas fa-user-friends"></i> Users Directory</h2>
                    <div class="view-controls">
                        <button id="gridViewBtn" class="view-btn active" title="Grid View">
                            <i class="fas fa-th"></i>
                        </button>
                        <button id="listViewBtn" class="view-btn" title="List View">
                            <i class="fas fa-list"></i>
                        </button>
                    </div>
                </div>

                <div id="loadingSpinner" class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Loading users...
                </div>

                <div id="usersContainer" class="users-grid">
                </div>

                <div id="emptyState" class="empty-state hidden">
                    <i class="fas fa-users-slash"></i>
                    <h3>No users found</h3>
                    <p>Try adjusting your search or filters</p>
                    <button id="resetFilters" class="btn btn-outline">Reset Filters</button>
                </div>
            </div>
        </section>
    </main>

    <div id="userModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle"><i class="fas fa-user"></i> User Details</h3>
                <button id="closeModal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div id="modalUserInfo"></div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 UserManager Pro. Built with TypeScript & <i class="fas fa-heart"></i></p>
            <div class="footer-links">
                <a href="index.html" class="link-btn">Home</a>
                <span class="separator">|</span>
                <a href="users.html" class="link-btn">Users</a>
                <span class="separator">|</span>
                <a href="posts.html" class="link-btn">Posts</a>
                <span class="separator">|</span>
                <a href="gallery.html" class="link-btn">Gallery</a>
            </div>
        </div>
    </footer>

    <script src="dist/users.js"></script>
</body>
</html>
